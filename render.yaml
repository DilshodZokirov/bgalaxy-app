services:
  - type: web
    name: bgalaxy-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # Domainsiz vaqtinchalik test: false → email yuborilmaydi, Google/login ishlaydi.
      # Domen + Resend tayyor bo‘lgach true qiling.
      - key: EMAIL_ENABLED
        value: "false"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: INITIAL_DEVELOPER_EMAIL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: ENVIRONMENT
        value: production
