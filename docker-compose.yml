version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bgalaxy
      POSTGRES_PASSWORD: bgalaxy
      POSTGRES_DB: bgalaxy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  coturn:
    image: coturn/coturn:latest
    command: >
      -n --log-file=stdout
      --realm=bgalaxy.local
      --user=bgalaxy:bgalaxy
      --lt-cred-mech
      --fingerprint
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/udp"
      - "5349:5349/tcp"

volumes:
  postgres_data:

